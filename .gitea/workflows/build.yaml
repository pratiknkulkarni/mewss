# Gitea Actions CI. Deliberately `.gitea/workflows/`, matching pratik/saveit and
# pratik/lightcurve.
#
# The only registered runner is a Raspberry Pi 4 (label `pi-arm64`), and the
# homelab this deploys to is also arm64, so the published images are arm64-only
# — same as saveit and lightcurve.
#
# This was briefly multi-arch. Emulating the amd64 half through QEMU on the Pi
# cost ~27min for the API image alone and the jobs run one at a time on the
# single runner, which is not worth paying on every push for machines that
# rarely pull. Anything not arm64 builds from source instead; see the README.
#
# To publish another architecture anyway, set `platforms` via workflow_dispatch
# (e.g. linux/amd64,linux/arm64) — it will be slow for the reason above.

name: Build and publish images

on:
  push:
    branches: [main]
    tags: ["v*"]
    # A docs-only commit should not spend Pi time republishing a byte-identical
    # image under a new tag.
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:
    inputs:
      platforms:
        description: "Target platforms (e.g. linux/arm64 or linux/amd64,linux/arm64)"
        required: false
        default: "linux/arm64"

concurrency:
  group: build-${{ github.ref }}
  # Never cancel a release mid-push; superseded branch pushes are fine to drop.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  REGISTRY: gitea.15092021.xyz
  NAMESPACE: pratik

jobs:
  verify:
    runs-on: pi-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: mewss-scheduler/go.mod
          cache-dependency-path: mewss-scheduler/go.sum

      - name: Vet
        working-directory: mewss-scheduler
        run: go vet ./...

      # internal/repository drives a real Postgres through testcontainers, which
      # needs a Docker socket this job does not get. Everything else is a pure
      # unit test. The image builds themselves cover the API and client: the API
      # Dockerfile runs `tsc --noEmit` and the client Dockerfile runs the Vite
      # build, so a type error there still fails the publish.
      - name: Test
        working-directory: mewss-scheduler
        run: go test $(go list ./... | grep -v '/internal/repository')

  build:
    needs: verify
    runs-on: pi-arm64
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mewss-api
            context: ./mewss-api
          - name: mewss-client
            context: ./mewss-client
          - name: mewss-scheduler
            context: ./mewss-scheduler
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # secrets.GITEA_TOKEN does NOT work here: Gitea 1.27's package registry
      # authenticates users and PATs, not the ephemeral per-task Actions token.
      # REGISTRY_TOKEN is a user-level secret (a PAT with write:package), so it
      # needs nothing configured per-repository. The username must be the token's
      # owner — repository_owner, not actor.
      - name: Log in to the Gitea registry
        run: |
          echo "${{ secrets.REGISTRY_TOKEN }}" \
            | docker login "${REGISTRY}" \
                -u "${{ github.repository_owner }}" --password-stdin

      - name: Compute image tags
        id: meta
        run: |
          IMAGE="${REGISTRY}/${NAMESPACE}/${{ matrix.name }}"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAGS="--tag ${IMAGE}:${{ github.ref_name }}"
          else
            TAGS="--tag ${IMAGE}:latest --tag ${IMAGE}:main-$(echo "${{ github.sha }}" | cut -c1-7)"
          fi
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.name }}
        run: |
          docker buildx build \
            --platform "${{ inputs.platforms || 'linux/arm64' }}" \
            ${{ steps.meta.outputs.tags }} \
            --build-arg VITE_API_BASE_URL= \
            --cache-from type=registry,ref=${{ steps.meta.outputs.image }}:buildcache \
            --cache-to   type=registry,ref=${{ steps.meta.outputs.image }}:buildcache,mode=max \
            --push \
            "${{ matrix.context }}"
