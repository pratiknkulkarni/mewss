name: Build and publish images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platforms:
        description: "Target platforms (e.g. linux/amd64,linux/arm64)"
        required: false
        default: "linux/amd64"

env:
  REGISTRY: gitea.15092021.xyz
  NAMESPACE: pratik

jobs:
  test-scheduler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: mewss-scheduler/go.mod
          cache-dependency-path: mewss-scheduler/go.sum

      - name: Vet
        working-directory: mewss-scheduler
        run: go vet ./...

      # The repository package drives a real Postgres via testcontainers, which
      # needs a Docker socket the runner may not expose. Everything else is
      # pure unit tests.
      - name: Test
        working-directory: mewss-scheduler
        run: go test $(go list ./... | grep -v '/internal/repository')

  build:
    needs: test-scheduler
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mewss-api
            context: ./mewss-api
          - name: mewss-client
            context: ./mewss-client
          - name: mewss-scheduler
            context: ./mewss-scheduler
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the Gitea container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITEA_TOKEN }}

      # latest + the commit SHA on every main build; the bare version as well
      # when the build was triggered by a v* tag.
      - name: Compute image tags
        id: tags
        run: |
          IMAGE="${REGISTRY}/${NAMESPACE}/${{ matrix.name }}"
          TAGS="${IMAGE}:latest,${IMAGE}:${GITHUB_SHA::7}"
          case "$GITHUB_REF" in
            refs/tags/v*)
              TAGS="${TAGS},${IMAGE}:${GITHUB_REF#refs/tags/v}"
              ;;
          esac
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: ${{ inputs.platforms || 'linux/amd64' }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # Empty means "call the API on the same origin the page was served
          # from", which is what the client's bundled nginx proxy expects.
          build-args: |
            VITE_API_BASE_URL=
