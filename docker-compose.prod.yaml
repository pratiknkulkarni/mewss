# Runs mewss from images published to the Gitea container registry.
#
#   docker login gitea.15092021.xyz
#   cp env.prod.example .env      # then edit MEWSS_PUBLIC_URL and the secrets
#   docker compose -f docker-compose.prod.yaml pull
#   docker compose -f docker-compose.prod.yaml up -d
#
# The published images are arm64-only. Every service also carries a `build:`
# stanza, so on any other architecture the same file works with one verb
# changed — `build` instead of `pull`, which produces the images locally for
# the host's own architecture:
#
#   docker compose -f docker-compose.prod.yaml build
#   docker compose -f docker-compose.prod.yaml up -d
#
# Only the client is published to the host. Everything else talks over the
# compose-internal networks, and the client's nginx proxies /api to the API,
# so the whole app is same-origin on a single port.

name: mewss

services:

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - backend

  # Owns the schema: runs the golang-migrate migrations on startup, so it has
  # to come up before the API touches any table.
  mewss-scheduler:
    image: ${MEWSS_REGISTRY:-gitea.15092021.xyz}/${MEWSS_NAMESPACE:-pratik}/mewss-scheduler:${MEWSS_TAG:-latest}
    build:
      context: ./mewss-scheduler
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
      API_PORT: ":8081"
      WORKER_COUNT: "5"
      POLL_INTERVAL: "10s"
      STALE_LOCK_CUTOFF: "15m"
      DB_MAX_OPEN_CONNS: "25"
      DB_MAX_IDLE_CONNS: "25"
      DB_CONN_MAX_LIFETIME: "5m"
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?INTERNAL_API_SECRET is required}
    restart: unless-stopped
    networks:
      - backend

  mewss-api:
    image: ${MEWSS_REGISTRY:-gitea.15092021.xyz}/${MEWSS_NAMESPACE:-pratik}/mewss-api:${MEWSS_TAG:-latest}
    build:
      context: ./mewss-api
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      mewss-scheduler:
        condition: service_started
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APPLICATION_NAME: ${APPLICATION_NAME:-mewss_api}
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      # Both are the URL the browser uses. The client proxies /api to this
      # service, so the API and the frontend share one origin.
      BETTER_AUTH_URL: ${MEWSS_PUBLIC_URL:?MEWSS_PUBLIC_URL is required}
      FRONTEND_URL: ${MEWSS_PUBLIC_URL}
      SCHEDULER_URL: "http://mewss-scheduler:8081"
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?INTERNAL_API_SECRET is required}
    expose:
      - "3000"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1" ]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped
    networks:
      - backend
      - frontend

  mewss-client:
    image: ${MEWSS_REGISTRY:-gitea.15092021.xyz}/${MEWSS_NAMESPACE:-pratik}/mewss-client:${MEWSS_TAG:-latest}
    build:
      context: ./mewss-client
      dockerfile: Dockerfile
      args:
        # Empty means "call the API on the same origin the page was served
        # from", which is what the nginx proxy in this image expects.
        VITE_API_BASE_URL: ""
    depends_on:
      mewss-api:
        condition: service_healthy
    ports:
      # Bind to every interface so other machines on the LAN can reach it.
      - "${MEWSS_PORT:-8080}:80"
    restart: unless-stopped
    networks:
      - frontend

volumes:
  postgres_data:

networks:
  frontend:
  backend:
