services:

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - backend

  mewss-scheduler:
    build:
      context: ./mewss-scheduler
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
      API_PORT: ":8081"
      WORKER_COUNT: "5"
      POLL_INTERVAL: "10s"
      STALE_LOCK_CUTOFF: "15m"
      DB_MAX_OPEN_CONNS: "25"
      DB_MAX_IDLE_CONNS: "25"
      DB_CONN_MAX_LIFETIME: "5m"
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
    restart: unless-stopped
    networks:
      - backend

  mewss-api:
    build:
      context: ./mewss-api
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APPLICATION_NAME: ${APPLICATION_NAME:-mewss_api}
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      SCHEDULER_URL: "http://mewss-scheduler:8081"
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
    expose:
      - "3000"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1" ]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks:
      - backend
      - frontend

  mewss-client:
    build:
      context: ./mewss-client
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
    depends_on:
      mewss-api:
        condition: service_healthy
    ports:
      # The only published port in the stack. Without it `make up` brings
      # everything online healthy and completely unreachable.
      - "${MEWSS_PORT:-8080}:80"
    restart: unless-stopped
    networks:
      - frontend

volumes:
  postgres_data:

networks:
  frontend:
  backend:

